<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiren's Basic Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Hiren's Basic Calculator</h1>
      <p>Enter your expression and view the result instantly without leaving the page.</p>
    </header>

    <section class="calculator" aria-label="Calculator interface">
      <div class="calculator__display" aria-live="polite">
        <div class="calculator__expression" id="expression">0</div>
        <div class="calculator__result" id="result">Result</div>
      </div>

      <div class="calculator__controls">
        <div class="keypad">
          <button type="button" class="keypad__button keypad__button--muted" data-action="clear">C</button>
          <button type="button" class="keypad__button keypad__button--muted" data-action="backspace">⌫</button>
          <button type="button" class="keypad__button keypad__button--muted" data-value="%">%</button>
          <button type="button" class="keypad__button keypad__button--accent" data-value="/">÷</button>

          <button type="button" class="keypad__button" data-value="7">7</button>
          <button type="button" class="keypad__button" data-value="8">8</button>
          <button type="button" class="keypad__button" data-value="9">9</button>
          <button type="button" class="keypad__button keypad__button--accent" data-value="*">×</button>

          <button type="button" class="keypad__button" data-value="4">4</button>
          <button type="button" class="keypad__button" data-value="5">5</button>
          <button type="button" class="keypad__button" data-value="6">6</button>
          <button type="button" class="keypad__button keypad__button--accent" data-value="-">−</button>

          <button type="button" class="keypad__button" data-value="1">1</button>
          <button type="button" class="keypad__button" data-value="2">2</button>
          <button type="button" class="keypad__button" data-value="3">3</button>
          <button type="button" class="keypad__button keypad__button--accent" data-value="+">+</button>

          <button type="button" class="keypad__button keypad__button--wide" data-value="0">0</button>
          <button type="button" class="keypad__button" data-value=".">.</button>
          <button type="button" class="keypad__button keypad__button--primary" data-action="calculate">=</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
